
name: Build Telegram Checker APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: unzip -q TelegramChecker_Project.zip -d .

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle -p TelegramChecker assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TelegramChecker-APK
          path: TelegramChecker/app/build/outputs/apk/debug/app-debug.apk
